# docker-compose.yml — Full stack deployment
#
# Usage:
#   make setup    # create .env from template
#   make deploy   # build and start everything
#
# Or manually:
#   cp .env.production.example .env
#   docker compose up -d --build
#
# Services:
#   - caddy:    Reverse proxy with automatic HTTPS, serves client static files
#   - server:   NestJS backend (API + WebSocket/SFU)
#   - client:   Build-only container, produces static files for Caddy
#   - postgres: PostgreSQL 16 database

services:
  # --- Client build (init container pattern) ---
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    volumes:
      - client_dist:/srv/client
    # This container exits after copying files; restart is not needed
    restart: "no"

  # --- Database migrations (runs once before server starts) ---
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- NestJS backend ---
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: production
    container_name: zvonok-server
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN_MINUTES: ${JWT_ACCESS_EXPIRES_IN_MINUTES:-15}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      CLIENT_URL: ${CLIENT_URL:-https://localhost}
      NODE_ENV: production
      # mediasoup network
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40099}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Server is not exposed directly; Caddy proxies to it
    expose:
      - "3000"
    # RTC media ports must be published directly (Caddy cannot proxy UDP/RTP)
    ports:
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}/udp"
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}/tcp"

  # --- PostgreSQL database ---
  postgres:
    image: postgres:16-alpine
    container_name: zvonok-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # DB is not exposed to host by default; only internal
    expose:
      - "5432"

  # --- Caddy reverse proxy ---
  caddy:
    image: caddy:2-alpine
    container_name: zvonok-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - client_dist:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      client:
        condition: service_completed_successfully
      server:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  client_dist:
