# docker-compose.prod.yml — Production deployment (pulls pre-built images from GHCR)
#
# This file is used on the VPS. Images are built and pushed by GitHub Actions.
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Required:
#   - .env file with production values (see .env.production.example)
#   - GHCR_REPO env var set to the GitHub repository (e.g., user/webrtc-chat)
#   - Logged in to ghcr.io: echo $TOKEN | docker login ghcr.io -u USER --password-stdin

services:
  # --- Client build (init container pattern) ---
  client:
    image: ghcr.io/${GHCR_REPO}/client:latest
    volumes:
      - client_dist:/srv/client
    restart: "no"

  # --- Database migrations (runs once before server starts) ---
  migrate:
    image: ghcr.io/${GHCR_REPO}/migrator:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- NestJS backend ---
  server:
    image: ghcr.io/${GHCR_REPO}/server:latest
    container_name: zvonok-server
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN_MINUTES: ${JWT_ACCESS_EXPIRES_IN_MINUTES:-15}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      CLIENT_URL: ${CLIENT_URL:-https://localhost}
      NODE_ENV: production
      # mediasoup network
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40099}
      # TURN credentials (sent to clients as ICE servers)
      TURN_URL: ${TURN_URL:-}
      TURNS_URL: ${TURNS_URL:-}
      TURN_USER: ${TURN_USER:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      coturn:
        condition: service_started
    restart: unless-stopped
    expose:
      - "3000"
    # RTC media ports must be published directly (Caddy cannot proxy UDP/RTP)
    ports:
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}/udp"
      - "${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}:${RTC_MIN_PORT:-40000}-${RTC_MAX_PORT:-40099}/tcp"

  # --- PostgreSQL database ---
  postgres:
    image: postgres:16-alpine
    container_name: zvonok-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "5432"

  # --- Caddy reverse proxy ---
  caddy:
    image: caddy:2-alpine
    container_name: zvonok-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - client_dist:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      client:
        condition: service_completed_successfully
      server:
        condition: service_started
    restart: unless-stopped

  # --- coturn TURN/STUN server ---
  coturn:
    image: coturn/coturn:alpine
    container_name: zvonok-coturn
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${TURN_EXTERNAL_IP}
      - --realm=${SITE_ADDRESS:-localhost}
      - --user=${TURN_USER}:${TURN_PASSWORD}
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  client_dist:
