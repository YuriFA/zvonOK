# turnserver.conf — coturn TURN/STUN server configuration
#
# Dynamic values (user, password, external-ip, realm) are passed
# via CLI arguments in docker-compose.yml because coturn does not
# interpolate environment variables in config files.

# Listening
listening-port=3478
tls-listening-port=5349

# Network
relay-ip=0.0.0.0
min-port=49152
max-port=49252

# Auth
lt-cred-mech

# Security
no-multicast-peers
no-cli
fingerprint
stale-nonce=600

# Logging
log-file=stdout
verbose
