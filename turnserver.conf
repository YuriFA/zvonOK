# turnserver.conf - coturn TURN/STUN server configuration
#
# The shared REST auth secret is passed via CLI arguments in the prod
# compose coturn command because coturn does not interpolate environment
# variables in config files. Never put the real secret in this file.

# Listening
listening-port=3478
tls-listening-port=5349

# Network
relay-ip=0.0.0.0
min-port=49152
max-port=49252

# Auth: ephemeral REST credentials (draft-uberti-rtcweb-turn-rest),
# verified against the shared secret passed on the command line
use-auth-secret

# Security
no-multicast-peers
no-cli
fingerprint
stale-nonce=600

# Logging
log-file=stdout
verbose
